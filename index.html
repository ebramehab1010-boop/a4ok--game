<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>do4 - Ultra Compact Fullscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background: #070b14; color: #f8fafc; font-family: 'Tajawal', sans-serif;
            text-align: center; margin: 0; padding: 2px; 
            height: 100svh; width: 100vw; overflow: hidden; /* يمنع التقليب نهائياً */
            display: flex; flex-direction: column;
        }
        h1 { 
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            margin: 2px 0; font-size: 1.4rem; letter-spacing: 1px; flex-shrink: 0; font-weight: 900; 
        }
        
        .screen { display: none; width: 100%; max-width: 100%; margin: 0; flex: 1; flex-direction: column; position: relative; height: 100%; overflow: hidden; }
        .screen.active { display: flex; justify-content: space-between; }
        .hidden { display: none !important; pointer-events: none; }

        /* ================== القوائم المدمجة ================== */
        .glass-panel {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px;
            width: 100%; max-width: 500px; margin: auto; max-height: 98vh; overflow-y: auto;
        }
        .glass-panel h2 { color: #d4af37; font-size: 1.5rem; margin: 0 0 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 5px; }
        
        .setup-section { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .setup-section h3 { margin: 0 0 5px 0; color: #cbd5e1; font-size: 1rem; }
        .name-input { padding: 8px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; width: 100%; margin-bottom: 6px; font-family: 'Tajawal'; font-size: 0.9rem; background: rgba(0,0,0,0.6); color: #fff; }
        .name-input:focus { outline: none; border-color: #d4af37; }

        .radio-group { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
        .radio-label { background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-weight: 700; font-size: 0.85rem; color: #94a3b8; }
        .radio-label input { display: none; }
        .radio-label.selected { border-color: #d4af37; background: rgba(212, 175, 55, 0.15); color: #d4af37; }

        /* ================== الترابيزة (ثابتة ومش بتتمط) ================== */
        .table-area {
            position: relative; 
            background-color: #2c1005;
            background-image: radial-gradient(circle at center, rgba(139, 69, 19, 0.4) 0%, rgba(20, 5, 0, 0.9) 100%);
            border: 4px solid #1a0b05; border-radius: 12px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 0 1px #d4af37;
            width: 100%; flex: 1; /* تأخذ كل المساحة المتاحة في النص */
            margin: 2px 0; overflow: hidden;
        }

        /* اللاعبين الآليين (حجم كنز جداً) */
        .ai-player {
            position: absolute; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            width: 50px; height: 50px; font-size: 0.65rem; font-weight: 700; z-index: 10; color: #e2e8f0;
        }
        .ai-player span.player-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
        .ai-player .playing-tag { color: #d4af37; font-size: 0.6rem; animation: blink 1.5s infinite; }
        .ai-player.active-turn { border-color: #d4af37; background: rgba(212, 175, 55, 0.15); }
        .ai-player.won { opacity: 0.3; }
        .ai-player .badge { background: #d4af37; color: #000; padding: 1px 4px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; }
        
        .pos-top { top: 2px; left: 50%; transform: translateX(-50%); height: auto; width: auto; padding: 2px 10px; flex-direction: row; }
        .pos-left { left: 2px; top: 50%; transform: translateY(-50%); }
        .pos-right { right: 2px; top: 50%; transform: translateY(-50%); }

        /* منطقة الرصة في نص الترابيزة بالضبط */
        .center-board { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 5;
        }
        #turn-banner { color: #d4af37; padding: 2px 15px; border-radius: 8px; font-size: 0.85rem; font-weight: 900; background: rgba(0,0,0,0.5); }
        .current-claim-box { background: rgba(0,0,0,0.7); color: #e2e8f0; padding: 4px 12px; border-radius: 8px; font-size: 0.8rem; }
        #current-claim { color: #d4af37; font-size: 1.1rem; font-weight: 900; margin-right: 4px;}
        .board-stats { font-size: 0.7rem; color: #94a3b8; background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 6px; }
        #table-stack { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-height: 60px; overflow: hidden; }

        /* منطقة التجهيز ثابتة في أسفل الترابيزة */
        #staging-area {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 2px; justify-content: center; align-items: center;
            min-width: 100px; min-height: 48px; padding: 10px 4px 4px 4px;
            background: rgba(0,0,0,0.5); border: 1px dashed rgba(212, 175, 55, 0.6); border-radius: 10px; z-index: 15;
        }
        #staging-area::before {
            content: "مُجهز"; position: absolute; top: -10px; color: #d4af37; font-size: 0.65rem; font-weight: 700; background: #000; padding: 1px 6px; border-radius: 4px;
        }

        .status-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px; padding: 6px; margin: 2px 0; width: 100%; font-size: 0.85rem; font-weight: 700; color: #d4af37; flex-shrink: 0; }

        /* ================== الورق واللاعب (أحجام نانو) ================== */
        .player-area { flex-shrink: 0; position: relative; z-index: 15; width: 100%; }
        #box-player { margin: 0 0 4px 0; color: #d4af37; font-size: 0.9rem; font-weight: 900; padding: 2px 15px; border-radius: 8px; display: inline-block; background: rgba(0,0,0,0.5); }
        
        .hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-bottom: 4px; min-height: 48px; }

        /* الورق صغرناه جداً عشان يكفي أي عدد */
        .domino-piece {
            width: 22px; height: 44px; background: linear-gradient(145deg, #ffffff, #e2e8f0); border-radius: 4px; cursor: pointer; display: flex; flex-direction: column;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.5); border: 1px solid #cbd5e1; flex-shrink: 0; transition: 0.1s;
        }
        .domino-piece.selected { transform: translateY(-4px); border: 2px solid #3b82f6; }
        #staging-area .domino-piece { transform: translateY(0); border: 1px solid #3b82f6; }
        
        .dots-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); flex: 1; padding: 1px; align-items: center; justify-items: center; }
        .dot { background: #111; border-radius: 50%; width: 4px; height: 4px; }
        .divider { width: 80%; height: 1px; background: #94a3b8; margin: 0 auto; }
        
        .facedown-piece { width: 14px; height: 28px; background: linear-gradient(145deg, #94a3b8, #64748b); border-radius: 2px; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); border: 1px solid #475569; margin: 1px; }
        .old-piece { opacity: 0.8; }
        .new-piece { border: 1px solid #d4af37; }
        .separator-line { width: 2px; height: 24px; background: rgba(212, 175, 55, 0.8); margin: 0 4px; }

        /* ================== أزرار التحكم ملمومة ================== */
        .btn {
            background: rgba(255, 255, 255, 0.05); color: #cbd5e1; padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; font-family: 'Tajawal'; font-weight: 700;
            cursor: pointer; font-size: 0.9rem; flex: 1; margin: 2px;
        }
        .btn-primary { background: #d4af37; color: #000; border: none; font-weight: 900; }
        .btn-danger { background: #ef4444; color: #fff; border: none; }
        .btn-blue { background: #3b82f6; color: #fff; border: none; }
        
        .controls-container { background: rgba(0,0,0,0.6); border-radius: 10px; padding: 6px; margin: 2px 0 0 0; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
        .claim-selector { display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; }
        .claim-btn { background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 32px; height: 32px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .claim-btn.active { background: #d4af37; color: #000; border: none; }

        /* بابلز الكلام */
        .player-bubble { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; white-space: nowrap; opacity: 0; z-index: 50; border: 1px solid #f59e0b; transition: 0.2s; }
        .player-bubble.show { opacity: 1; top: -30px; }
        #bubble-player.player-bubble { top: -25px; }
        #bubble-player.player-bubble.show { top: -35px; }

        /* المودالز */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 10px;}
        .settings-btn { position: absolute; top: 5px; left: 5px; background: rgba(255,255,255,0.05); color: #d4af37; border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .chat-toggle-btn { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); color: #d4af37; border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-family: 'Tajawal'; font-size: 0.8rem; cursor: pointer; z-index: 100; }
        .chat-container { position: absolute; bottom: 40px; left: 5px; width: 220px; height: 30vh; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; display: flex; flex-direction: column; z-index: 101; }
        .chat-container.hidden { display: none; }
        .chat-header { background: rgba(0,0,0,0.4); color: #d4af37; padding: 6px; font-weight: 900; display: flex; justify-content: space-between; font-size: 0.85rem;}
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; max-width: 90%; text-align: right;}
        .msg-player { background: rgba(212, 175, 55, 0.1); color: #d4af37; align-self: flex-start; border: 1px solid rgba(212, 175, 55, 0.2); }
        .msg-ai { background: rgba(255,255,255,0.05); color: #cbd5e1; align-self: flex-end; border: 1px solid rgba(255,255,255,0.05); }
        .chat-input-area { display: flex; padding: 4px; background: rgba(0,0,0,0.3); }
        .chat-input-area input { flex: 1; padding: 6px; border-radius: 4px; border: none; background: rgba(0,0,0,0.5); color: #fff; font-family: 'Tajawal'; font-size: 0.8rem; outline: none; }
        .chat-send-btn { background: transparent; color: #3b82f6; border: none; padding: 0 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية -->
    <div id="lobby-screen" class="screen active">
        <div class="glass-panel">
            <h2>do4 🀄</h2>
            <button id="resume-btn" class="btn btn-blue hidden" style="margin-bottom: 10px;" onclick="resumeGame()">استكمال الجيم السابق 🔄</button>

            <div class="setup-section">
                <h3>لعب أونلاين 🌐</h3>
                <input type="text" id="online-player-name" class="name-input" placeholder="اسمك">
                <button class="btn btn-primary" onclick="createOnlineRoom()" style="width: 100%; margin-bottom: 5px;">إنشاء غرفة 🏠</button>
                <div style="display:flex; gap: 5px;">
                    <input type="text" id="room-code-input" class="name-input" placeholder="الكود" style="width: 60%; margin: 0;">
                    <button class="btn btn-blue" onclick="joinOnlineRoom()" style="width: 40%; margin: 0;">انضمام</button>
                </div>
            </div>

            <div class="setup-section">
                <h3>لعب فردي (ضد الكمبيوتر) 🤖</h3>
                <input type="text" id="single-player-name" class="name-input" placeholder="اسمك">
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="aiCount" value="1" onclick="updateRadioUI(this)">1 كمبيوتر</label>
                    <label class="radio-label selected"><input type="radio" name="aiCount" value="2" checked onclick="updateRadioUI(this)">2 كمبيوتر</label>
                    <label class="radio-label"><input type="radio" name="aiCount" value="3" onclick="updateRadioUI(this)">3 كمبيوتر</label>
                </div>
                <button class="btn btn-primary" onclick="startGameMode('ai')">ابدأ التحدي 🔥</button>
            </div>

            <div class="setup-section">
                <h3>لعب محلي 📱</h3>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="localCount" value="2" onclick="updateLocalInputs(this)">2 لاعبين</label>
                    <label class="radio-label selected"><input type="radio" name="localCount" value="3" checked onclick="updateLocalInputs(this)">3 لاعبين</label>
                    <label class="radio-label"><input type="radio" name="localCount" value="4" onclick="updateLocalInputs(this)">4 لاعبين</label>
                </div>
                <div id="local-names-container"></div>
                <button class="btn btn-blue" style="margin-top: 5px;" onclick="startGameMode('local')">بدء لعب محلي</button>
            </div>
        </div>
    </div>

    <!-- غرفة الانتظار -->
    <div id="waiting-screen" class="screen">
        <div class="glass-panel">
            <h2>غرفة الانتظار ⏳</h2>
            <h1 id="room-code-display" style="font-size: 3rem; color: #d4af37; margin: 5px 0;">----</h1>
            <div id="online-players-list" style="display:flex; flex-direction:column; gap:5px; font-weight: bold; color: #fff; font-size: 0.9rem; margin-bottom: 10px;"></div>
            <button id="start-online-btn" class="btn btn-primary hidden" onclick="startOnlineGame()">ابدأ اللعبة 🔥</button>
            <button class="btn btn-danger" style="margin-top: 5px;" onclick="leaveOnlineRoom()">خروج</button>
        </div>
    </div>

    <!-- النتائج -->
    <div id="score-screen" class="screen">
        <div class="glass-panel">
            <h2>لوحة الشرف 🏆</h2>
            <div id="scoreboard-body" style="text-align: right; margin-bottom: 15px; font-size: 1rem; color: #fff;"></div>
            <div style="display: flex; gap: 5px;">
                <button class="btn btn-primary" onclick="startNewRound()">جولة جديدة 🔄</button>
                <button class="btn" onclick="returnToMenu()">خروج 🚪</button>
            </div>
        </div>
    </div>

    <!-- شاشة اللعب الرئيسية (Compact & Locked) -->
    <div id="game-screen" class="screen">
        <button class="settings-btn" onclick="openSettings()">⚙</button>
        <h1>do4</h1>

        <div class="table-area" id="main-table">
            <!-- المساحة في النص للرصة -->
            <div class="center-board">
                <div id="turn-banner" class="hidden">الدور على: --</div>
                <div class="current-claim-box">المطلوب: <strong id="current-claim">--</strong></div>
                <div id="table-stack"></div>
                <div class="board-stats">الرمية: <span id="last-played-count">0</span> | الأرض: <span id="total-stack">0</span></div>
            </div>
            <!-- مساحة التجهيز تحت الرصة -->
            <div id="staging-area"></div>
        </div>

        <div class="status-box" id="status-message">جاري التوزيع...</div>

        <!-- أزرار الشك -->
        <div id="player-reaction-controls" class="hidden" style="display:flex; justify-content:center; gap:5px; flex-shrink: 0; width:100%; padding:0 5px; margin-bottom: 2px;">
            <button class="btn btn-danger" onclick="playerDoubts()">أكشفه! 🤨</button>
            <button class="btn" onclick="playerPasses()">تخطي 🤫</button>
        </div>

        <!-- منطقة اللاعب أسفل الشاشة -->
        <div class="player-area">
            <div style="position: relative; display: inline-block;">
                <div class="player-bubble" id="bubble-player"></div>
                <div id="box-player"><span id="player-name-display">ورقك</span> <span class="playing-tag hidden" id="player-playing-tag">بيلعب...</span></div>
            </div>
            
            <div class="hand" id="player-hand"></div>
            
            <div class="controls-container hidden" id="player-play-controls">
                <div id="claim-section">
                    <div class="claim-selector">
                        <button class="claim-btn" onclick="selectClaim(0)">0</button><button class="claim-btn" onclick="selectClaim(1)">1</button><button class="claim-btn" onclick="selectClaim(2)">2</button><button class="claim-btn" onclick="selectClaim(3)">3</button><button class="claim-btn" onclick="selectClaim(4)">4</button><button class="claim-btn" onclick="selectClaim(5)">5</button><button class="claim-btn" onclick="selectClaim(6)">6</button>
                    </div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn btn-primary" id="play-btn" onclick="playPiece()">العب 🚀</button>
                    <button class="btn btn-blue" id="gala-btn" onclick="playerGala()">جـــلا 🏃‍♂️</button>
                </div>
            </div>
        </div>
        
        <button class="chat-toggle-btn" id="chat-toggle" onclick="toggleChat()">💬 شات</button>
        <div id="chat-window" class="chat-container hidden">
            <div class="chat-header"><span>الشات</span><span class="close-chat" onclick="toggleChat()">✖</span></div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب..." onkeypress="handleChatPress(event)">
                <button class="chat-send-btn" onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- النوافذ -->
    <div id="win-overlay" class="modal-overlay hidden">
        <div class="glass-panel" style="text-align: center;">
            <div style="font-size: 4rem;">🎉👑🎉</div>
            <h2 id="win-name" style="color: #fff; font-size: 2rem;">--</h2>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="glass-panel" style="width: 85%; max-width: 300px;">
            <h2 style="font-size: 1.4rem;">إعدادات ⚙️</h2>
            <button class="btn btn-primary" onclick="closeSettings()" style="margin-bottom: 5px;">استكمال اللعب ▶️</button>
            <button class="btn btn-danger" onclick="withdrawGame()">شطب وانسحاب 🏳️</button>
        </div>
    </div>

    <div id="pass-phone-modal" class="modal-overlay hidden">
        <div class="glass-panel" style="width: 85%; max-width: 300px; text-align:center;">
            <h2 id="pass-phone-text" style="color: #fff; font-size: 1.2rem; margin-bottom: 15px;">مرر الجهاز إلى ...</h2>
            <button class="btn btn-blue" onclick="acceptPhone()">استلمت الجهاز 📱</button>
        </div>
    </div>

    <div id="local-reaction-modal" class="modal-overlay hidden">
        <div class="glass-panel" style="width: 85%; max-width: 300px;">
            <h2 id="local-reaction-text" style="color: #e2e8f0; font-size: 1.1rem; border: none; margin-bottom: 5px;">قام اللاعب باللعب..</h2>
            <p style="color: #f87171; font-weight: 900; font-size: 1.2rem; margin-bottom: 10px;">المطلوب: <span id="local-reaction-claim"></span></p>
            <div id="local-doubter-buttons" style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;"></div>
            <button class="btn" style="width: 100%;" onclick="passLocalDoubt()">تخطي 🤫</button>
        </div>
    </div>

    <script>
        // ================= إعدادات Firebase =================
        const firebaseConfig = {
            apiKey: "AIzaSyCD3jR3M4tPo3S08wic58E6t9Q35mabqK0",
            authDomain: "do44-4319b.firebaseapp.com",
            databaseURL: "https://do44-4319b-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "do44-4319b",
            storageBucket: "do44-4319b.firebasestorage.app",
            messagingSenderId: "512561379349",
            appId: "1:512561379349:web:fd86bd9ab8fee30312361c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================= المتغيرات الأساسية =================
        let gameMode = 'ai'; let totalPlayersCount = 3; 
        let players = []; let playerNames = {}; let hands = {}; let hasWon = {}; let scores = {};
        let stack = []; let lastPlayedPieces = []; let turnIndex = 0; let lastPlayerId = ''; 
        let selectedPieces = []; let activeNumber = -1; let userSelectedClaim = -1; 
        
        let doubtHandled = false; let reactionTimers = []; let aiWillDoubtFlag = false;
        let isProcessingTurn = false; let consecutiveGalas = 0; 
        window.isAnimatingDoubt = false; window.pendingSyncData = null;
        
        let roomCode = ""; let isHost = false; let myId = ""; 
        let roomListener = null; let chatListener = null;

        const PIPS = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

        function sortHand(hand) { if(!hand) return; hand.forEach(p => { if (p[1] > p[0]) { let temp = p[0]; p[0] = p[1]; p[1] = temp; } }); hand.sort((a, b) => { if (a[0] !== b[0]) return b[0] - a[0]; return b[1] - a[1]; }); }

        function isValidName(n) {
            if(n.includes("إبرام") || n.includes("ابرام")) { alert("ممنوع استخدام هذا الاسم!"); return false; }
            return true;
        }

        window.onload = function() {
            updateLocalInputs(document.querySelector('input[name="localCount"]:checked'));
            if(localStorage.getItem('do4Save')) document.getElementById('resume-btn').classList.remove('hidden');
        };

        function updateRadioUI(element) { let group = element.closest('.radio-group'); group.querySelectorAll('.radio-label').forEach(lbl => lbl.classList.remove('selected')); element.parentElement.classList.add('selected'); }

        function updateLocalInputs(element) {
            if(element) updateRadioUI(element);
            let count = parseInt(document.querySelector('input[name="localCount"]:checked').value);
            let container = document.getElementById('local-names-container'); container.innerHTML = '';
            for(let i=1; i<=count; i++) { container.innerHTML += `<input type="text" id="local-name-${i}" class="name-input" placeholder="لاعب ${i}" style="margin-bottom: 4px; padding: 8px;">`; }
        }

        function saveGame() {
            if(gameMode === 'online') return;
            let state = { gameMode, totalPlayersCount, players, playerNames, hands, hasWon, scores, stack, lastPlayedPieces, turnIndex, lastPlayerId, activeNumber, consecutiveGalas, myId };
            localStorage.setItem('do4Save', JSON.stringify(state));
        }

        function clearSave() { localStorage.removeItem('do4Save'); document.getElementById('resume-btn').classList.add('hidden'); }
        function releaseProcessingLock() { isProcessingTurn = false; doubtHandled = false; }

        function resumeGame() {
            let saved = JSON.parse(localStorage.getItem('do4Save'));
            if(!saved || saved.gameMode === 'online') return;
            gameMode = saved.gameMode; totalPlayersCount = saved.totalPlayersCount; players = saved.players; playerNames = saved.playerNames;
            hands = saved.hands || {}; hasWon = saved.hasWon || {}; scores = saved.scores || {}; stack = saved.stack || []; lastPlayedPieces = saved.lastPlayedPieces || [];
            turnIndex = saved.turnIndex || 0; lastPlayerId = saved.lastPlayerId || ""; activeNumber = saved.activeNumber; consecutiveGalas = saved.consecutiveGalas || 0;
            myId = saved.myId || 'p0'; selectedPieces = []; releaseProcessingLock();
            players.forEach(p => { if(hands[p]) sortHand(hands[p]); else hands[p] = []; });

            document.getElementById('chat-toggle').classList.toggle('hidden', gameMode === 'local');
            switchScreen('game-screen'); setupTableUI(); updateUI(); highlightTurn(players[turnIndex]);
            
            if (lastPlayedPieces.length > 0 && consecutiveGalas === 0) {
                setStatus(`استكمال: ${playerNames[lastPlayerId]} لعب ${lastPlayedPieces.length} ورقات.`, "#fff");
                if (gameMode === 'local') showLocalReactionModal(); else startReactionPhase(lastPlayerId);
            } else {
                let activePlayerId = players[turnIndex];
                if (activePlayerId === myId) { setStatus(`استكمال: دورك يا ${playerNames[myId]}..`, "#d4af37"); document.getElementById('player-play-controls').classList.remove('hidden'); } 
                else if (gameMode === 'local') { showPassPhoneModal(activePlayerId); } 
                else { setStatus(`استكمال: انتظار ${playerNames[activePlayerId]}...`, "#94a3b8"); setTimeout(executeAITurn, 2000); }
            }
        }

        function switchScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); }
        function returnToMenu() { scores = {}; if(gameMode === 'online') leaveOnlineRoom(); switchScreen('lobby-screen'); }
        function startNewRound() { document.getElementById('win-overlay').classList.add('hidden'); if(gameMode === 'online' && isHost) startOnlineGame(); else if (gameMode !== 'online') { switchScreen('game-screen'); initGame(); } }

        // ================= الأونلاين الآمن =================
        function createOnlineRoom() {
            let name = document.getElementById('online-player-name').value.trim() || "اللاعب";
            if(!isValidName(name)) return;
            gameMode = 'online'; isHost = true; myId = "p_" + Math.random().toString(36).substr(2, 6);
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            players = [myId]; playerNames = {}; playerNames[myId] = name; scores = {}; scores[myId] = 0;
            db.ref('rooms/' + roomCode).set({ status: 'waiting', host: myId, players: players, names: playerNames, scores: scores });
            document.getElementById('room-code-display').innerText = roomCode; switchScreen('waiting-screen'); listenToRoom();
        }

        function joinOnlineRoom() {
            let code = document.getElementById('room-code-input').value.trim();
            if(code.length !== 4) return alert("الكود لازم يكون 4 أرقام!");
            let name = document.getElementById('online-player-name').value.trim() || "اللاعب";
            if(!isValidName(name)) return;
            
            db.ref('rooms/' + code).once('value').then(snap => {
                if(!snap.exists()) return alert("الغرفة غير موجودة!");
                let data = snap.val(); if(data.status !== 'waiting') return alert("اللعبة بدأت بالفعل!");
                gameMode = 'online'; isHost = false; roomCode = code; myId = "p_" + Math.random().toString(36).substr(2, 6);
                let pList = data.players || []; if(pList.length >= 4) return alert("الغرفة ممتلئة!");
                pList.push(myId); let nms = data.names || {}; nms[myId] = name; let scrs = data.scores || {}; scrs[myId] = 0;
                db.ref('rooms/' + roomCode).update({ players: pList, names: nms, scores: scrs });
                document.getElementById('room-code-display').innerText = roomCode; document.getElementById('start-online-btn').classList.add('hidden');
                switchScreen('waiting-screen'); listenToRoom();
            });
        }

        function listenToRoom() {
            if(roomListener) db.ref('rooms/' + roomCode).off('value', roomListener);
            if(chatListener) db.ref('rooms/' + roomCode + '/chat').off('child_added', chatListener);
            
            roomListener = db.ref('rooms/' + roomCode).on('value', snap => {
                if(!snap.exists()) { leaveOnlineRoom(); return; }
                let data = snap.val();
                if(data.status === 'waiting') {
                    players = data.players || []; playerNames = data.names || {}; scores = data.scores || {};
                    let html = "";
                    players.forEach(p => { html += `<div style="background:rgba(255,255,255,0.1); padding:6px; border-radius:6px;">${playerNames[p]} ${p===data.host?'👑':''}</div>`; });
                    document.getElementById('online-players-list').innerHTML = html;
                    if(isHost && players.length > 1) document.getElementById('start-online-btn').classList.remove('hidden');
                } else if(data.status === 'playing') {
                    if(document.getElementById('waiting-screen').classList.contains('active')) { switchScreen('game-screen'); setupTableUI(); listenToChat(); }
                    
                    if (data.doubtEvent) {
                        executeDoubtLocally(data);
                    } else {
                        if (isHost && data.doubtPhase) {
                            let passes = data.passes || {};
                            let activeRem = (data.players || []).filter(p => !(data.hasWon || {})[p]).length;
                            if (Object.keys(passes).length >= activeRem - 1) {
                                let nextT = getNextPlayerIndexLogic(data.turnIndex, data.players, data.hasWon || {});
                                let lastHand = (data.hands || {})[data.lastPlayerId] || [];
                                if (lastHand.length === 0) {
                                    if (!data.hasWon) data.hasWon = {};
                                    data.hasWon[data.lastPlayerId] = true;
                                    if (data.players.filter(p => !data.hasWon[p]).length <= 1) { db.ref('rooms/' + roomCode).update({ winner: data.lastPlayerId }); return; }
                                    nextT = getNextPlayerIndexLogic(data.players.indexOf(data.lastPlayerId), data.players, data.hasWon);
                                }
                                db.ref('rooms/' + roomCode).update({ turnIndex: nextT, doubtPhase: false, passes: null, hasWon: data.hasWon || {} }); return;
                            }
                        }
                        syncGameState(data);
                    }
                }
            });
        }

        function startOnlineGame() {
            totalPlayersCount = players.length; let deck = [];
            for(let i=0; i<=6; i++) for(let j=i; j<=6; j++) { if((totalPlayersCount===3||totalPlayersCount===4)&&i===0&&j===0) continue; deck.push([i, j]); }
            deck.sort(() => Math.random() - 0.5); hands = {}; hasWon = {};
            let cPP = totalPlayersCount===2 ? 14 : (totalPlayersCount===3 ? 9 : 6);
            players.forEach((p, idx) => { hands[p] = deck.slice(idx*cPP, (idx+1)*cPP); sortHand(hands[p]); hasWon[p] = false; });
            let starter = players[0]; let maxD = -1;
            for(let d=6; d>=0; d--) { let found = players.find(p => hands[p].some(t => t[0]===d && t[1]===d)); if(found) { starter = found; maxD = d; break; } }
            if(!starter) { starter = players[0]; maxD = Math.max(...hands[starter].map(p => Math.max(p[0], p[1]))); }
            db.ref('rooms/' + roomCode).update({ status: 'playing', turnIndex: players.indexOf(starter), activeNumber: maxD, hands: hands, hasWon: hasWon, stack: [], lastPlayedPieces: [], lastPlayerId: "", consecutiveGalas: 0, doubtPhase: false, passes: null, winner: null, doubtEvent: null });
        }

        function getNextPlayerIndexLogic(currentIndex, pArr, wArr) {
            let nextIdx = (currentIndex + 1) % pArr.length; let safety = 0;
            while (wArr[pArr[nextIdx]] && safety < pArr.length) { nextIdx = (nextIdx + 1) % pArr.length; safety++; } 
            return nextIdx;
        }

        function syncGameState(data) {
            if (window.isAnimatingDoubt) { window.pendingSyncData = data; return; }
            applySyncData(data);
        }

        function applySyncData(data) {
            players = data.players || []; playerNames = data.names || {}; scores = data.scores || {};
            hands = data.hands || {}; hasWon = data.hasWon || {};
            turnIndex = data.turnIndex || 0; activeNumber = data.activeNumber === undefined ? -1 : data.activeNumber;
            stack = data.stack || []; lastPlayedPieces = data.lastPlayedPieces || []; lastPlayerId = data.lastPlayerId || ""; consecutiveGalas = data.consecutiveGalas || 0;
            
            if(data.winner) {
                if(data.winner === 'draw') { showWinOverlay("انسحاب! مفيش فايز", () => updateScoreboard()); } 
                else {
                    if(isHost && !scores.updated) { scores[data.winner]++; db.ref('rooms/'+roomCode+'/scores').set(scores); db.ref('rooms/'+roomCode).update({'scores/updated': true}); }
                    showWinOverlay(playerNames[data.winner], () => updateScoreboard());
                }
                return;
            }

            if (data.doubtEvent) { if(!doubtHandled) { doubtHandled = true; window.isAnimatingDoubt = true; executeDoubtLocally(data); } return; }
            releaseProcessingLock(); updateUI(); highlightTurn(players[turnIndex]); 
            
            if(data.doubtPhase) {
                let passes = data.passes || {};
                if(lastPlayerId !== myId && !hasWon[myId] && !passes[myId]) {
                    showTurnControls(false); document.getElementById('player-reaction-controls').classList.remove('hidden');
                    setStatus(`نزل ${playerNames[lastPlayerId]} ${lastPlayedPieces.length} ورقات كـ (${activeNumber}). هتشك؟`, "#f87171");
                } else { showTurnControls(false); setStatus(`انتظار قرار الباقين...`, "#94a3b8"); }
            } else {
                document.getElementById('player-reaction-controls').classList.add('hidden');
                if(players[turnIndex] === myId) { setStatus(activeNumber===-1 ? `افتح برقم` : `العب كـ (${activeNumber})`, "#d4af37"); document.getElementById('player-play-controls').classList.remove('hidden'); }
                else { setStatus(`الدور على ${playerNames[players[turnIndex]]}...`, "#94a3b8"); showTurnControls(false); }
            }
        }

        function leaveOnlineRoom() {
            if(roomCode && myId) {
                if(isHost) db.ref('rooms/' + roomCode).remove();
                else db.ref('rooms/' + roomCode).once('value').then(snap => { if(snap.exists()) { let d = snap.val(); if(d.status === 'playing') db.ref('rooms/'+roomCode).update({winner: 'draw'}); else db.ref('rooms/'+roomCode).update({players: d.players.filter(p=>p!==myId)}); }});
            }
            if(roomListener) db.ref('rooms/' + roomCode).off('value', roomListener);
            if(chatListener) db.ref('rooms/' + roomCode + '/chat').off('child_added', chatListener);
            roomCode = ""; gameMode = 'ai'; switchScreen('lobby-screen');
        }

        // ================= الأوفلاين الأساسي =================
        function startGameMode(mode) {
            clearSave(); gameMode = mode; players = []; playerNames = {}; scores = {};
            if (mode === 'ai') {
                let typedName = document.getElementById('single-player-name').value.trim(); 
                let mainName = typedName !== "" ? typedName : "اللاعب";
                if(!isValidName(mainName)) return;
                totalPlayersCount = parseInt(document.querySelector('input[name="aiCount"]:checked').value) + 1;
                myId = 'player'; players.push(myId); playerNames[myId] = mainName; scores[myId] = 0;
                for(let i=1; i<totalPlayersCount; i++) { players.push(`comp${i}`); playerNames[`comp${i}`] = `الكمبيوتر ${i}`; scores[`comp${i}`] = 0; }
                document.getElementById('chat-toggle').classList.remove('hidden');
            } else {
                totalPlayersCount = parseInt(document.querySelector('input[name="localCount"]:checked').value);
                myId = 'local1';
                for(let i=1; i<=totalPlayersCount; i++) {
                    let typed = document.getElementById(`local-name-${i}`).value.trim();
                    let pName = typed !== "" ? typed : `لاعب ${i}`;
                    if(!isValidName(pName)) return;
                    let pId = `local${i}`; players.push(pId); scores[pId] = 0; playerNames[pId] = pName;
                }
                document.getElementById('chat-toggle').classList.add('hidden');
            }
            setupTableUI(); startNewRound();
        }

        function setupTableUI() {
            document.querySelectorAll('.ai-player').forEach(el => el.remove()); const table = document.getElementById('main-table');
            let otherPlayers = gameMode === 'ai' ? players.filter(p => p !== 'player') : (gameMode === 'online' ? players.filter(p=>p!==myId) : players); 
            let positions = [];
            if (otherPlayers.length === 1) positions = ['pos-top'];
            else if (otherPlayers.length === 2) positions = ['pos-left', 'pos-right'];
            else if (otherPlayers.length === 3) positions = ['pos-left', 'pos-top', 'pos-right'];
            else if (otherPlayers.length === 4) positions = ['pos-left', 'pos-top', 'pos-right', 'pos-top'];
            
            otherPlayers.forEach((p, i) => {
                if (positions[i]) { 
                    table.innerHTML += `<div class="ai-player ${positions[i]}" id="box-${p}">
                        <div class="player-bubble" id="bubble-${p}"></div>
                        <span class="player-name">${playerNames[p]}</span>
                        <span class="playing-tag hidden" id="tag-${p}">بيلعب</span>
                        <span id="count-${p}" class="badge">0</span>
                    </div>`; 
                }
            });
        }

        function updateScoreboard() {
            let sortedPlayers = players.map(p => ({ id: p, name: playerNames[p], score: scores[p] })).sort((a, b) => b.score - a.score);
            let tbody = document.getElementById('scoreboard-body'); tbody.innerHTML = '';
            sortedPlayers.forEach((p, index) => { 
                let rowColor = index === 0 && p.score > 0 ? 'color: #d4af37;' : 'color: #e2e8f0;';
                tbody.innerHTML += `<div style="margin-bottom: 5px; ${rowColor}">${index + 1}. ${p.name} - ${p.score}</div>`; 
            });
            switchScreen('score-screen');
        }

        function getDotsHTML(num) {
            const layouts = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
            let html = '<div class="dots-grid">'; for(let i=0; i<9; i++) { html += layouts[num].includes(i) ? '<div class="dot"></div>' : '<div></div>'; } return html + '</div>';
        }

        function initGame() {
            releaseProcessingLock(); stack = []; lastPlayedPieces = []; selectedPieces = []; 
            activeNumber = -1; userSelectedClaim = -1; consecutiveGalas = 0; doubtHandled = false; window.isAnimatingDoubt = false; window.pendingSyncData = null;
            document.querySelectorAll('.claim-btn').forEach(btn => btn.classList.remove('active')); hideAllControls();
            document.getElementById('win-overlay').classList.add('hidden');

            let allPieces = []; let is3Players = totalPlayersCount === 3; let is4Players = totalPlayersCount === 4;
            for (let i = 0; i <= 6; i++) { for (let j = i; j <= 6; j++) { if((is3Players || is4Players) && i === 0 && j === 0) continue; allPieces.push([i, j]); } }
            allPieces.sort(() => Math.random() - 0.5); 
            
            let cardsPerPlayer = (totalPlayersCount === 2) ? 14 : ((totalPlayersCount === 3) ? 9 : 6); 
            players.forEach((p, index) => { 
                hands[p] = allPieces.slice(index * cardsPerPlayer, (index + 1) * cardsPerPlayer); sortHand(hands[p]); hasWon[p] = false; 
            });
            
            let highestDouble = -1; let starter = null;
            for (let d = 6; d >= 0; d--) { let p = players.find(player => hands[player].some(piece => piece[0] === d && piece[1] === d)); if (p) { highestDouble = d; starter = p; break; } }
            if (!starter) { starter = players[0]; highestDouble = Math.max(...hands[starter].map(p => Math.max(p[0], p[1]))); }
            
            turnIndex = players.indexOf(starter); activeNumber = highestDouble; saveGame();

            if (gameMode === 'local') { showPassPhoneModal(starter); } 
            else {
                updateUI(); highlightTurn(starter);
                if(starter === myId) { setStatus(`معاك البلاطة (${highestDouble}-${highestDouble})! افتح الدور.`, "#d4af37"); document.getElementById('player-play-controls').classList.remove('hidden'); } 
                else { setStatus(`انتظار ${playerNames[starter]} يفتح بـ (${highestDouble})...`, "#94a3b8"); setTimeout(executeAITurn, 2000); }
            }
        }

        function highlightTurn(activePlayerId) {
            const banner = document.getElementById('turn-banner'); banner.innerText = `الدور على: ${playerNames[activePlayerId]}`; banner.classList.remove('hidden');
            document.querySelectorAll('.playing-tag').forEach(tag => tag.classList.add('hidden'));

            players.forEach(p => { 
                let box = document.getElementById(`box-${p}`); 
                if (box) { box.classList.remove('active-turn'); if (hasWon[p]) box.classList.add('won'); else if (p === activePlayerId) { box.classList.add('active-turn'); if(document.getElementById(`tag-${p}`)) document.getElementById(`tag-${p}`).classList.remove('hidden'); } } 
            });
            
            let playerBox = document.getElementById('box-player');
            if(playerBox) { 
                const playerNameDisplay = document.getElementById('player-name-display');
                if (playerNameDisplay) { playerNameDisplay.innerText = `أوراق ${playerNames[gameMode === 'local' ? activePlayerId : myId]}`; }
                if(activePlayerId === myId || gameMode === 'local') { playerBox.classList.add('active-turn'); let pTag = document.getElementById('player-playing-tag'); if(pTag) pTag.classList.remove('hidden'); } else { playerBox.classList.remove('active-turn'); }
            }
            if (gameMode === 'local') { players.forEach(p => { let box = document.getElementById(`box-${p}`); if(box) { if(p === activePlayerId) box.style.display = 'none'; else box.style.display = 'flex'; } }); }
        }

        function showWinOverlay(winnerName, callback) {
            const overlay = document.getElementById('win-overlay'); const nameEl = document.getElementById('win-name');
            nameEl.innerText = winnerName; overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.add('hidden'); callback(); }, 3500);
        }

        function checkGameOver() {
            let activeCount = players.filter(p => !hasWon[p]).length;
            if (activeCount <= 1) {
                clearSave(); let winner = players.find(p => hasWon[p]); if(winner) scores[winner] += 1;
                hideAllControls(); document.getElementById('turn-banner').classList.add('hidden');
                if (winner) showWinOverlay(playerNames[winner], () => updateScoreboard()); else updateScoreboard();
                return true;
            }
            return false;
        }

        function updateUI() {
            let activePlayerId = players[turnIndex]; const handDiv = document.getElementById('player-hand'); const stagingDiv = document.getElementById('staging-area');
            handDiv.innerHTML = ''; if(stagingDiv) stagingDiv.innerHTML = '';
            let currentHand = (gameMode === 'local') ? hands[activePlayerId] : hands[myId];
            
            if(currentHand) {
                currentHand.forEach((piece, index) => {
                    const el = document.createElement('div'); el.className = `domino-piece`; el.innerHTML = getDotsHTML(piece[0]) + '<div class="divider"></div>' + getDotsHTML(piece[1]); el.onclick = () => selectPiece(index); 
                    if (selectedPieces.includes(index)) { if(stagingDiv) stagingDiv.appendChild(el); } else { handDiv.appendChild(el); }
                });
            }

            const playerNameDisplay = document.getElementById('player-name-display');
            if(playerNameDisplay) playerNameDisplay.innerText = `أوراق ${playerNames[gameMode === 'local' ? activePlayerId : myId]}`;
            
            let oldPiecesCount = stack.length - lastPlayedPieces.length; let html = '';
            for(let i=0; i<oldPiecesCount; i++) { html += `<div class="facedown-piece old-piece"></div>`; }
            if(oldPiecesCount > 0 && lastPlayedPieces.length > 0) { html += `<div class="separator-line"></div>`; }
            lastPlayedPieces.forEach((p, i) => { html += `<div class="facedown-piece new-piece" style="animation-delay: ${i*0.05}s"></div>`; });
            document.getElementById('table-stack').innerHTML = html;

            players.forEach(p => { if(document.getElementById(`count-${p}`)) { let pHand = hands[p] || []; document.getElementById(`count-${p}`).innerText = hasWon[p] ? 'فاز' : pHand.length; } });
            document.getElementById('last-played-count').innerText = lastPlayedPieces.length; document.getElementById('total-stack').innerText = stack.length;
            
            const claimSection = document.getElementById('claim-section'); const playBtn = document.getElementById('play-btn'); const currentClaimText = document.getElementById('current-claim'); const galaBtn = document.getElementById('gala-btn');
            let selText = selectedPieces.length > 0 ? ` (${selectedPieces.length})` : '';
            if(activeNumber === -1) { currentClaimText.innerText = "اختار رقم"; claimSection.style.display = "flex"; playBtn.innerText = "العب" + selText; galaBtn.style.display = 'none'; } else { currentClaimText.innerText = activeNumber; claimSection.style.display = "none"; playBtn.innerText = `العب كـ (${activeNumber})` + selText; if(stack.length === 0) galaBtn.style.display = 'none'; else galaBtn.style.display = 'inline-block'; }
        }

        function setStatus(msg, color = "#d4af37") { document.getElementById('status-message').innerText = msg; document.getElementById('status-message').style.color = color; }
        function hideAllControls() { document.getElementById('player-play-controls').classList.add('hidden'); document.getElementById('player-reaction-controls').classList.add('hidden'); }
        function showTurnControls(show) { if(!show) hideAllControls(); }
        function selectClaim(num) { userSelectedClaim = num; document.querySelectorAll('.claim-btn').forEach(btn => btn.classList.remove('active')); document.querySelectorAll('.claim-btn')[num].classList.add('active'); }

        function selectPiece(index) {
            if(isProcessingTurn) return; let activePlayerId = players[turnIndex]; if (gameMode !== 'local' && activePlayerId !== myId) return; if (hasWon[activePlayerId]) return;
            const pos = selectedPieces.indexOf(index); if (pos > -1) selectedPieces.splice(pos, 1); else if (selectedPieces.length < 7) selectedPieces.push(index); updateUI();
        }

        function playerGala() {
            if(isProcessingTurn) return; if(activeNumber === -1 || stack.length === 0) return; 
            isProcessingTurn = true; consecutiveGalas++; hideAllControls(); doubtHandled = false;
            if(gameMode === 'online') { db.ref('rooms/' + roomCode).update({ consecutiveGalas: consecutiveGalas }).then(() => { handleGalaNextLogic(); }); } 
            else { let activePlayerId = players[turnIndex]; setStatus(`${playerNames[activePlayerId]} تخطى دوره (جلا)`, "#94a3b8"); saveGame(); setTimeout(checkGalaAndNext, 1200); }
        }

        function playPiece() {
            if(isProcessingTurn) return; if (selectedPieces.length === 0) { alert("حدد ورقة واحدة على الأقل!"); return; }
            let claim = activeNumber === -1 ? userSelectedClaim : activeNumber; if (claim === -1) { alert("اختر الرقم لفتح الدور!"); return; } 
            
            isProcessingTurn = true; consecutiveGalas = 0; doubtHandled = false; activeNumber = claim; selectedPieces.sort((a,b) => b-a); lastPlayedPieces = []; lastPlayerId = players[turnIndex];
            let currentHand = gameMode === 'local' ? hands[lastPlayerId] : hands[myId]; if(!currentHand) currentHand = [];
            selectedPieces.forEach(idx => { let p = currentHand.splice(idx, 1)[0]; lastPlayedPieces.push(p); stack.push(p); });
            selectedPieces = []; userSelectedClaim = -1; document.querySelectorAll('.claim-btn').forEach(btn => btn.classList.remove('active')); hideAllControls(); 

            if(gameMode === 'online') { db.ref('rooms/' + roomCode).update({ activeNumber: activeNumber, stack: stack, lastPlayedPieces: lastPlayedPieces, lastPlayerId: lastPlayerId, hands: hands, consecutiveGalas: 0, doubtPhase: true, passes: null, doubtEvent: null }); } 
            else { updateUI(); setStatus(`تم لعب ${lastPlayedPieces.length} ورقات كـ (${claim}). هتشك ولا تخطي؟`, "#f87171"); saveGame(); if (gameMode === 'local') setTimeout(showLocalReactionModal, 800); else startReactionPhase('player'); }
        }

        function handleGalaNextLogic() {
            let activePlayers = players.filter(p => !hasWon[p]);
            if (consecutiveGalas >= activePlayers.length - 1 && stack.length > 0) {
                let nextStarter = lastPlayerId; if (hasWon[nextStarter]) nextStarter = activePlayers[0]; 
                db.ref('rooms/' + roomCode).update({ activeNumber: -1, consecutiveGalas: 0, turnIndex: players.indexOf(nextStarter) });
            } else { db.ref('rooms/' + roomCode).update({ turnIndex: getNextPlayerIndexLogic(turnIndex, players, hasWon) }); }
        }

        function executeAITurn() {
            let ai = players[turnIndex]; if(hasWon[ai]) return proceedToNextTurn(turnIndex); 
            isProcessingTurn = true; doubtHandled = false; let currentHand = hands[ai] || [];

            if(activeNumber !== -1 && stack.length > 0) {
                let matches = currentHand.filter(p => p[0] === activeNumber || p[1] === activeNumber);
                if(matches.length === 0 && Math.random() > 0.4) { consecutiveGalas++; setStatus(`${playerNames[ai]} تخطى دوره (جلا)`, "#94a3b8"); saveGame(); setTimeout(checkGalaAndNext, 1500); return; }
            }

            consecutiveGalas = 0; lastPlayerId = ai; lastPlayedPieces = [];
            if(activeNumber === -1) { let p = currentHand.splice(Math.floor(Math.random() * currentHand.length), 1)[0]; activeNumber = p[0]; lastPlayedPieces.push(p); } 
            else {
                let matches = currentHand.filter(p => p[0] === activeNumber || p[1] === activeNumber);
                if (Math.random() < 0.7 && matches.length > 0) { let numToPlay = Math.min(matches.length, Math.floor(Math.random()*2) + 1); for(let i=0; i<numToPlay; i++) lastPlayedPieces.push(currentHand.splice(currentHand.indexOf(matches[i]), 1)[0]); } 
                else { let numToPlay = Math.floor(Math.random()*2) + 1; for(let i=0; i<numToPlay; i++) { if(currentHand.length === 0) break; lastPlayedPieces.push(currentHand.splice(Math.floor(Math.random() * currentHand.length), 1)[0]); } }
            }
            stack.push(...lastPlayedPieces); updateUI(); setStatus(`قام ${playerNames[ai]} بلعب ${lastPlayedPieces.length} ورقات. هتشك ولا تخطي؟`, "#f87171"); saveGame(); startReactionPhase(ai);
        }

        function checkGalaAndNext() {
            let activePlayers = players.filter(p => !hasWon[p]);
            if (consecutiveGalas >= activePlayers.length - 1 && stack.length > 0) {
                let nextStarter = lastPlayerId; if (hasWon[nextStarter]) nextStarter = activePlayers[0]; 
                setStatus(`الجميع تخطى.. ${playerNames[nextStarter]} سيفتح برقم جديد`, "#d4af37"); activeNumber = -1; consecutiveGalas = 0; turnIndex = players.indexOf(nextStarter);
                setTimeout(() => { if(gameMode === 'local') showPassPhoneModal(players[turnIndex]); else playNextHelper(); }, 2500);
            } else { proceedToNextTurn(turnIndex); }
        }

        function startReactionPhase(targetId) {
            doubtHandled = false; aiWillDoubtFlag = false; reactionTimers.forEach(clearTimeout); reactionTimers = [];
            let otherAIs = players.filter(ai => ai !== targetId && ai !== myId && !hasWon[ai]);

            otherAIs.forEach(ai => {
                let currentHand = hands[ai] || []; let doubtChance = 0.15; if (lastPlayedPieces.length > 2) doubtChance += 0.3;
                let matchCount = currentHand.filter(p => p[0] === activeNumber || p[1] === activeNumber).length;
                if (matchCount >= 2) doubtChance += 0.4; if (matchCount + lastPlayedPieces.length > 7) doubtChance = 1.0;
                if (Math.random() < doubtChance) { aiWillDoubtFlag = true; reactionTimers.push(setTimeout(() => executeDoubtLocallyOffline(ai, targetId), Math.floor(Math.random() * 1500) + 1000)); }
            });

            if (targetId !== myId && !hasWon[myId]) { document.getElementById('player-reaction-controls').classList.remove('hidden'); } 
            else if (!aiWillDoubtFlag) { reactionTimers.push(setTimeout(() => handleNoDoubtLocally(targetId), 2000)); }
        }

        function playerDoubts() { hideAllControls(); if(gameMode === 'online') { db.ref('rooms/' + roomCode).update({ doubtEvent: { doubterId: myId, targetId: lastPlayerId }, doubtPhase: false }); } else { executeDoubtLocallyOffline(myId, lastPlayerId); } }
        function playerPasses() { hideAllControls(); if(gameMode === 'online') { db.ref('rooms/' + roomCode + '/passes/' + myId).set(true); setStatus("تم التخطي.. انتظار الباقين", "#94a3b8"); } else { if (aiWillDoubtFlag) setStatus("تخطي.. انتظار الباقين...", "#94a3b8"); else handleNoDoubtLocally(lastPlayerId); } }

        function showPassPhoneModal(nextPlayerId) { document.getElementById('player-hand').innerHTML = ''; document.getElementById('staging-area').innerHTML = ''; hideAllControls(); releaseProcessingLock(); let msg = activeNumber !== -1 && stack.length === 0 ? `معاك البلاطة (${activeNumber}-${activeNumber})! مرر لـ ${playerNames[nextPlayerId]}` : `مرر الجهاز إلى ${playerNames[nextPlayerId]}`; document.getElementById('pass-phone-text').innerText = msg; document.getElementById('pass-phone-modal').classList.remove('hidden'); }
        function acceptPhone() { document.getElementById('pass-phone-modal').classList.add('hidden'); updateUI(); highlightTurn(players[turnIndex]); let msg = activeNumber !== -1 && stack.length === 0 ? `معاك البلاطة (${activeNumber}-${activeNumber})! افتح الدور.` : `دورك يا ${playerNames[players[turnIndex]]}..`; setStatus(msg, "#d4af37"); document.getElementById('player-play-controls').classList.remove('hidden'); }
        function showLocalReactionModal() { document.getElementById('local-reaction-claim').innerText = activeNumber; document.getElementById('local-reaction-text').innerText = `لعب ${playerNames[lastPlayerId]} ${lastPlayedPieces.length} ورقات.`; let btnContainer = document.getElementById('local-doubter-buttons'); btnContainer.innerHTML = ''; let otherPlayers = players.filter(p => p !== lastPlayerId && !hasWon[p]); otherPlayers.forEach(p => { btnContainer.innerHTML += `<button class="btn btn-danger" style="width:100%; font-size:1rem; padding: 10px;" onclick="executeLocalDoubt('${p}', '${lastPlayerId}')">أكشفه! (${playerNames[p]}) 🤨</button>`; }); document.getElementById('local-reaction-modal').classList.remove('hidden'); }
        function executeLocalDoubt(doubterId, targetId) { document.getElementById('local-reaction-modal').classList.add('hidden'); executeDoubtLocallyOffline(doubterId, targetId); }
        function passLocalDoubt() { document.getElementById('local-reaction-modal').classList.add('hidden'); handleNoDoubtLocally(lastPlayerId); }

        function flyCardsToPlayer(targetId, callback) {
            try {
                const stackDiv = document.getElementById('table-stack'); let boxId = `box-${targetId}`; if (targetId === myId || (gameMode === 'local' && targetId === lastPlayerId)) boxId = 'box-player'; const targetBox = document.getElementById(boxId);
                if (!stackDiv || !targetBox || stack.length === 0) { callback(); return; }
                const targetRect = targetBox.getBoundingClientRect(); const targetX = targetRect.left + (targetRect.width / 2); const targetY = targetRect.top + (targetRect.height / 2);
                const pieces = stackDiv.querySelectorAll('.facedown-piece, .domino-piece'); if (!pieces || pieces.length === 0) { callback(); return; }
                pieces.forEach((piece, index) => { const rect = piece.getBoundingClientRect(); const deltaX = targetX - (rect.left + (rect.width / 2)); const deltaY = targetY - (rect.top + (rect.height / 2)); piece.style.transition = `transform 0.5s cubic-bezier(0.25, 1, 0.5, 1) ${index * 0.05}s, opacity 0.4s ease-in ${index * 0.05}s`; piece.style.zIndex = 1000 + index; piece.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.2) rotate(${Math.random() * 360}deg)`; piece.style.opacity = '0'; });
                setTimeout(callback, 500 + (pieces.length * 50));
            } catch (e) { callback(); }
        }

        function executeDoubtLocallyOffline(doubterId, targetId) {
            if (doubtHandled) return; doubtHandled = true; reactionTimers.forEach(clearTimeout); reactionTimers = []; hideAllControls();
            let isTruth = lastPlayedPieces.every(p => p[0] === activeNumber || p[1] === activeNumber); let html = ''; let oldC = stack.length - lastPlayedPieces.length;
            for(let i=0; i<oldC; i++) { html += `<div class="facedown-piece old-piece"></div>`; } if(oldC > 0 && lastPlayedPieces.length > 0) { html += `<div class="separator-line"></div>`; }
            lastPlayedPieces.forEach((p, i) => { html += `<div class="domino-piece flip-anim" style="pointer-events:none; animation-delay: ${i*0.1}s;">${getDotsHTML(p[0])}<div class="divider"></div>${getDotsHTML(p[1])}</div>`; });
            document.getElementById('table-stack').innerHTML = html;
            let loserId = isTruth ? doubterId : targetId; let msg = isTruth ? `${playerNames[targetId]} صادق! ${playerNames[doubterId]} يشيل 🚀` : `${playerNames[doubterId]} كشف كذب ${playerNames[targetId]}! 🚀`; setStatus(msg, isTruth ? "#f87171" : "#d4af37");
            
            setTimeout(() => {
                flyCardsToPlayer(loserId, () => {
                    if(!hands[loserId]) hands[loserId] = []; hands[loserId].push(...stack); sortHand(hands[loserId]);
                    let targetHand = hands[targetId] || []; if (isTruth && targetHand.length === 0) { hasWon[targetId] = true; turnIndex = getNextPlayerIndexLogic(players.indexOf(targetId), players, hasWon); } else { turnIndex = isTruth ? players.indexOf(targetId) : players.indexOf(doubterId); }
                    stack = []; lastPlayedPieces = []; activeNumber = -1; updateUI(); 
                    if (checkGameOver()) { releaseProcessingLock(); return; } saveGame(); if (gameMode === 'local') showPassPhoneModal(players[turnIndex]); else playNextHelper();
                });
            }, 1800);
        }

        function executeDoubtLocally(data) {
            if (window.isAnimatingDoubt) return; window.isAnimatingDoubt = true;
            let doubterId = data.doubtEvent.doubterId; let targetId = data.doubtEvent.targetId; let isTruth = (data.lastPlayedPieces || []).every(p => p[0] === data.activeNumber || p[1] === data.activeNumber);
            let html = ''; let oldC = (data.stack || []).length - (data.lastPlayedPieces || []).length;
            for(let i=0; i<oldC; i++) { html += `<div class="facedown-piece old-piece"></div>`; } if(oldC > 0 && (data.lastPlayedPieces || []).length > 0) { html += `<div class="separator-line"></div>`; }
            (data.lastPlayedPieces || []).forEach((p, i) => { html += `<div class="domino-piece flip-anim" style="pointer-events:none; animation-delay: ${i*0.1}s;">${getDotsHTML(p[0])}<div class="divider"></div>${getDotsHTML(p[1])}</div>`; }); document.getElementById('table-stack').innerHTML = html;
            let loserId = isTruth ? doubterId : targetId; let msg = isTruth ? `${playerNames[targetId]} صادق! ${playerNames[doubterId]} يشيل 🚀` : `${playerNames[doubterId]} كشف كذب ${playerNames[targetId]}! 🚀`; setStatus(msg, isTruth ? "#f87171" : "#d4af37");
            
            setTimeout(() => {
                flyCardsToPlayer(loserId, () => {
                    window.isAnimatingDoubt = false;
                    if (isHost) {
                        let newHands = data.hands || {}; if (!newHands[loserId]) newHands[loserId] = []; newHands[loserId].push(...(data.stack || [])); sortHand(newHands[loserId]);
                        let newHasWon = data.hasWon || {}; let targetHand = newHands[targetId] || []; let nextT = data.turnIndex;
                        if (isTruth) { if (targetHand.length === 0) { newHasWon[targetId] = true; nextT = getNextPlayerIndexLogic(data.players.indexOf(targetId), data.players, newHasWon); } else { nextT = data.players.indexOf(targetId); } } else { nextT = data.players.indexOf(doubterId); }
                        db.ref('rooms/' + roomCode).update({ hands: newHands, hasWon: newHasWon, turnIndex: nextT, stack: [], lastPlayedPieces: [], activeNumber: -1, doubtPhase: false, doubtEvent: null, passes: null });
                    }
                    if (window.pendingSyncData) { let p = window.pendingSyncData; window.pendingSyncData = null; syncGameState(p); }
                });
            }, 2000);
        }

        function handleNoDoubtLocally(targetId) {
            if (doubtHandled) return; doubtHandled = true; reactionTimers.forEach(clearTimeout); reactionTimers = []; let targetHand = hands[targetId] || [];
            if (targetHand.length === 0) { hasWon[targetId] = true; setStatus(`لا يوجد شك! ${playerNames[targetId]} فاز!`, "#d4af37"); if (checkGameOver()) return; setTimeout(() => { proceedToNextTurn(players.indexOf(targetId)); }, 2000); return; }
            setStatus(`لا يوجد شك.. التالي.`, "#94a3b8"); setTimeout(() => { proceedToNextTurn(turnIndex); }, 1200);
        }

        function proceedToNextTurn(currentIndex) {
            turnIndex = getNextPlayerIndexLogic(currentIndex, players, hasWon); saveGame();
            if (gameMode === 'local') { showPassPhoneModal(players[turnIndex]); } else { let nextPlayer = players[turnIndex]; highlightTurn(nextPlayer); releaseProcessingLock(); if (nextPlayer === myId) { setStatus(`دورك.. العب على (${activeNumber})!`, "#d4af37"); document.getElementById('player-play-controls').classList.remove('hidden'); } else { setStatus(`انتظار ${playerNames[nextPlayer]}...`, "#94a3b8"); setTimeout(executeAITurn, 1500); } }
        }

        function playNextHelper() { setStatus(`يبدأ ${playerNames[players[turnIndex]]} برقم جديد...`, "#94a3b8"); highlightTurn(players[turnIndex]); saveGame(); setTimeout(() => { releaseProcessingLock(); if (players[turnIndex] === myId) document.getElementById('player-play-controls').classList.remove('hidden'); else executeAITurn(); }, 1500); }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function withdrawGame() {
            closeSettings(); clearSave(); reactionTimers.forEach(clearTimeout); reactionTimers = []; hideAllControls(); releaseProcessingLock();
            if(gameMode === 'online') { leaveOnlineRoom(); return; }
            let activeOthers = players.filter(p => p !== players[turnIndex] && !hasWon[p]);
            if(activeOthers.length > 0) { let winner = activeOthers.sort((a,b) => (hands[a]||[]).length - (hands[b]||[]).length)[0]; scores[winner] += 1; setStatus(`انسحاب! فاز ${playerNames[winner]}.`, "#f87171"); } else { setStatus(`انسحاب من اللعبة.`, "#f87171"); } setTimeout(updateScoreboard, 2500);
        }
        
        function toggleChat() { document.getElementById('chat-window').classList.toggle('hidden'); }
        function handleChatPress(e) { if(e.key === 'Enter') sendChatMessage(); }

        function showBubble(senderId, text) {
            let boxId = (senderId === myId || (gameMode==='local' && senderId===players[turnIndex])) ? 'bubble-player' : `bubble-${senderId}`;
            let b = document.getElementById(boxId);
            if(b) { b.innerText = text; b.classList.add('show'); setTimeout(() => b.classList.remove('show'), 3000); }
        }

        function sendChatMessage() {
            let input = document.getElementById('chat-input'); let msg = input.value.trim(); if(msg === '') return;
            if(gameMode === 'online') { db.ref('rooms/' + roomCode + '/chat').push({ senderId: myId, senderName: playerNames[myId], text: msg }); }
            else {
                let chatBox = document.getElementById('chat-messages'); let currentLocalId = gameMode === 'local' ? players[turnIndex] : myId;
                chatBox.innerHTML += `<div class="chat-msg msg-player"><strong>${playerNames[currentLocalId]}:</strong> ${msg}</div>`; chatBox.scrollTop = chatBox.scrollHeight; showBubble(currentLocalId, msg);
                let activeAIs = players.filter(p => p !== myId && p.startsWith('comp'));
                if(activeAIs.length > 0) {
                    setTimeout(() => {
                        let ai = activeAIs[Math.floor(Math.random() * activeAIs.length)]; let aiReplies = ["العب يا عم", "أنا مركز معاك", "ورقك مكشوف", "هكسبك برضه"]; let reply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
                        chatBox.innerHTML += `<div class="chat-msg msg-ai"><strong>${playerNames[ai].split(' ')[0]}:</strong> ${reply}</div>`; chatBox.scrollTop = chatBox.scrollHeight; showBubble(ai, reply);
                    }, 1500 + Math.random() * 2000);
                }
            }
            input.value = '';
        }

        function listenToChat() {
            if(chatListener) db.ref('rooms/' + roomCode + '/chat').off('child_added', chatListener);
            document.getElementById('chat-messages').innerHTML = '';
            chatListener = db.ref('rooms/' + roomCode + '/chat').on('child_added', snap => {
                let msg = snap.val(); let isMe = msg.senderId === myId; let chatBox = document.getElementById('chat-messages');
                chatBox.innerHTML += `<div class="chat-msg ${isMe?'msg-player':'msg-ai'}"><strong>${msg.senderName}:</strong> ${msg.text}</div>`; chatBox.scrollTop = chatBox.scrollHeight; showBubble(msg.senderId, msg.text);
            });
        }
    </script>
</body>
